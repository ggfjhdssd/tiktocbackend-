services:
  - type: web
    name: tictocbackend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: MONGODB_URI_1
        sync: false
      - key: MONGODB_URI_2
        sync: false
      - key: APP_URL
        sync: false
      - key: PORT
        value: 3000
